<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesame</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #12141a; --panel: #1a1d26; --line: #2b3040; --text: #e6e8ef;
    --muted: #8b93a8; --accent: #5b8cff; --ok: #37c98b; --warn: #f0a83c; --bad: #f4635e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text);
         font: 13px/1.45 -apple-system, "SF Pro Text", "PingFang TC", system-ui, sans-serif; }
  #map { flex: 1; }
  #panel { width: 320px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
           overflow-y: auto; display: flex; flex-direction: column; }
  section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; }
  .brand { display: flex; align-items: center; gap: 9px; }
  /* Pixel art: keep the hard edges instead of letting the browser smooth them. */
  .brand img { width: 28px; height: 28px; image-rendering: pixelated; border-radius: 5px; }
  h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  select, input[type=text], input[type=number] {
    width: 100%; padding: 6px 8px; background: #10121a; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button { padding: 7px 10px; background: #232839; color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #2c3348; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: #3a2226; border-color: #5a2f34; color: #ffb4b0; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stack > * + * { margin-top: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
          padding: 3px 8px; border-radius: 999px; background: #232839; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.connected { background: var(--ok); }
  .dot.connecting, .dot.reconnecting { background: var(--warn); }
  .dot.error { background: var(--bad); }
  .meta { font-size: 11px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .bar { height: 4px; background: #10121a; border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
  .hint { font-size: 11px; color: var(--muted); }
  .lang { position: absolute; top: 12px; right: 14px; padding: 3px 8px; font-size: 11px; }
  #panel > section:first-child { position: relative; }
  .diagnosis { display: none; font-size: 11px; line-height: 1.5; padding: 8px 10px;
               border-radius: 6px; background: #3a2f22; border: 1px solid #5a4a2f;
               color: #f0d9a8; }
  .diagnosis ul { margin: 5px 0 0; padding-left: 16px; }
  .diagnosis li { margin-top: 3px; }
  #toast { position: absolute; left: 336px; top: 12px; z-index: 900; max-width: 460px;
           padding: 8px 12px; border-radius: 8px; background: #3a2226; border: 1px solid #5a2f34;
           color: #ffb4b0; font-size: 12px; display: none; }
  .leaflet-container { background: #0c0e13; }
  .leaflet-control-layers, .leaflet-bar a {
    background: var(--panel); color: var(--text); border-color: var(--line); }
  .leaflet-bar a:hover { background: #2c3348; color: var(--text); }
  .leaflet-control-layers-expanded { padding: 8px 10px; font: inherit; }
  .leaflet-control-layers label { color: var(--text); margin: 0; }
  .leaflet-control-attribution {
    background: rgba(18, 20, 26, .8) !important; color: var(--muted); font-size: 10px; }
  .leaflet-control-attribution a { color: var(--accent); }
  .vertex-label { font-size: 10px; color: #fff; text-shadow: 0 0 3px #000; }
</style>
</head>
<body>
<div id="panel">
  <section>
    <div class="brand">
      <img id="brandIcon" src="/icon.png" alt="" onerror="this.remove()">
      <h1>Sesame</h1>
    </div>
    <div class="meta" style="margin-top:6px" data-i18n="tagline"></div>
    <button id="langBtn" class="lang">EN</button>
  </section>

  <section class="stack">
    <h2 data-i18n="device"></h2>
    <select id="deviceSelect"></select>
    <div class="row">
      <button id="refreshBtn" data-i18n="rescan"></button>
      <button id="connectBtn" class="primary" data-i18n="connect"></button>
    </div>
    <div class="row">
      <button id="mountBtn" data-i18n="mountDdi"></button>
      <button id="disconnectBtn" class="danger" data-i18n="disconnect"></button>
    </div>
    <div class="row">
      <button id="pairBtn" data-i18n="pairUsb"></button>
    </div>
    <div>
      <span class="pill"><span id="stateDot" class="dot"></span><span id="stateText"></span></span>
    </div>
    <div class="meta" id="deviceMeta"></div>
    <div class="diagnosis" id="diagnosis"></div>
    <div class="meta" id="statsMeta"></div>
  </section>

  <section class="stack">
    <h2 data-i18n="mode"></h2>
    <div class="row">
      <button id="modeTeleport" class="on" data-i18n="teleport"></button>
      <button id="modeDraw" data-i18n="drawRoute"></button>
    </div>
    <div class="hint" id="modeHint"></div>
  </section>

  <section class="stack">
    <h2 data-i18n="location"></h2>
    <input type="text" id="placeInput" data-i18n-ph="placeInput">
    <div class="row">
      <button id="gotoBtn" class="primary" data-i18n="goHere"></button>
      <button id="panBtn" data-i18n="panOnly"></button>
    </div>
    <div class="row">
      <button id="appendBtn" data-i18n="addToRoute"></button>
      <button id="fillBtn" data-i18n="useCurrent"></button>
    </div>
    <div class="hint" data-i18n="locationHint"></div>
  </section>

  <section class="stack">
    <h2 data-i18n="route"></h2>
    <div class="meta"><span data-i18n="points"></span> <b id="pointCount">0</b> ·
      <span data-i18n="length"></span> <b id="routeLength">0 m</b></div>
    <div class="row">
      <button id="undoBtn" data-i18n="undo"></button>
      <button id="clearRouteBtn" data-i18n="clearRoute"></button>
    </div>
    <label><span data-i18n="speed"></span> <b id="speedValue">5.0</b> km/h</label>
    <input type="range" id="speedRange" min="0.5" max="120" step="0.5" value="5">
    <div class="grid4">
      <button data-speed="5" data-i18n="walk"></button>
      <button data-speed="10" data-i18n="jog"></button>
      <button data-speed="20" data-i18n="bike"></button>
      <button data-speed="60" data-i18n="drive"></button>
    </div>
    <div class="row">
      <button id="loopBtn"></button>
      <button id="jitterBtn"></button>
    </div>
    <div class="row">
      <button id="playBtn" class="primary"></button>
      <button id="pauseBtn" disabled data-i18n="pause"></button>
      <button id="stopBtn" disabled data-i18n="stop"></button>
    </div>
    <div>
      <div class="meta"><b id="progressText">0 / 0 m</b> ·
        <span data-i18n="remaining"></span> <b id="etaText">—</b></div>
      <div class="bar"><i id="progressBar"></i></div>
      <input type="range" id="seekRange" min="0" max="1" step="0.001" value="0">
    </div>
  </section>

  <section class="stack">
    <h2 data-i18n="currentPosition"></h2>
    <div class="meta" id="posMeta">—</div>
    <button id="clearLocBtn" data-i18n="restoreGps"></button>
  </section>
</div>

<div id="map"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

// ---- language ------------------------------------------------------------

// messages travel as codes so they can be phrased here too.

    connect: '連線', mountDdi: '掛載 DDI', disconnect: '斷線',
    pairUsb: 'USB 配對（WiFi 需要）', pairing: '配對中…看手機螢幕',
    mode: '模式', teleport: '點擊瞬移', drawRoute: '畫路線',
    hintTeleport: '在地圖上點一下就把裝置定位過去。',
    hintDraw: '點地圖加點 · 拖曳圓點移動 · 右鍵刪除 · 點線上插入中繼點。',
    location: '位置', placeInput: '37.3382, -121.8863 或 台北101',
    goHere: '定位到此', panOnly: '只移動地圖', addToRoute: '加到路線', useCurrent: '帶入目前位置',
    locationHint: '座標吃十進位、DMS、Google Maps 連結；打地名會先查再填回座標。'
      + 'Enter：座標直接定位，地名先搜尋。',
    route: '路線', points: '節點', length: '長度', undo: '退一點', clearRoute: '清除路線',
    speed: '速度', walk: '步行', jog: '慢跑', bike: '單車', drive: '開車',
    loop: '循環', jitter: '抖動', on: '開', off: '關',
    start: '開始', resumeRoute: '繼續', pause: '暫停', stop: '停止', remaining: '剩餘',
    currentPosition: '目前位置', restoreGps: '還原真實 GPS',
    layerDark: '深色', layerStreets: '街道', layerSatellite: '衛星',

    writes: '寫入', reconnects: '重連', heading: '航向',
    offline: '離線', lastSeen: '上次',
    tunneldDown: 'tunneld 未啟動', searching: '搜尋中',

    wifiOk: 'WiFi 探索設定正常',
    wifiOkDetail: '裝置可能沒解鎖，或不在同一個網路。',
    diag: {
      'stuck-daemon': ['裝置在網路上找得到，但 tunneld 一個 tunnel 都沒建立 —— 它卡住了。',

         'tunneld 對每個位址只嘗試一次，失敗後不會重試，長時間執行後就會這樣。']],
      'no-record': ['沒有配對記錄，WiFi 一定找不到裝置。',
        ['插上 USB 線，按「USB 配對」。']],
      'nothing-advertised': ['這個網路上沒有裝置在廣播。',
        ['解鎖手機。', '確認手機跟這台電腦連在同一個 WiFi。']],
      'private-address': ['配對記錄存的是真實硬體位址，但手機廣播的是私人位址，永遠對不上。',
        ['重新配對沒有用 —— 寫進去的還是同一個真實位址。',
         '手機上：設定 → WiFi → 網路旁的 ⓘ → 私人 WiFi 位址 → 關閉，再重新連線。']],
      'rotated-address': ['配對記錄跟正在廣播的位址對不上，手機換過位址了。',
        ['插上 USB 線，按「USB 配對」重新寫一次記錄。']],
    },
    pairErr: {
      'no-cable': '沒有偵測到用 USB 連著的裝置。配對必須走傳輸線 —— 這正是之後 WiFi 才找得到它的原因。',
      'unusable-record': '記錄寫好了但無法用於 WiFi 探索。',
    },
  },
};

let lang = 'en';
try { lang = localStorage.getItem('sesame.lang') || 'en'; } catch (error) { /* private mode */ }
if (!STRINGS[lang]) lang = 'en';

function t(key) { return STRINGS[lang][key]; }

function applyLanguage() {
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
  for (const node of document.querySelectorAll('[data-i18n]')) {
    node.textContent = t(node.dataset.i18n);
  }
  for (const node of document.querySelectorAll('[data-i18n-ph]')) {
    node.placeholder = t(node.dataset.i18nPh);
  }
  $('langBtn').textContent = lang === 'en' ? '中文' : 'EN';
  // Anything whose text depends on state has to be rebuilt, not just swapped.
  setMode(state.mode);
  refreshToggleLabels();
  if (lastSnapshot) render(lastSnapshot);
}

const map = L.map('map', { zoomControl: true }).setView([37.3382, -121.8863], 13);

// Every source here is keyless. CARTO's basemaps now stamp "API KEY REQUIRED"
// across each tile *and still answer 200*, so a paid source fails silently as a
// dark blank map rather than as an error -- not worth the risk for a default.
const ESRI_ATTRIBUTION = '&copy; <a href="https://www.esri.com">Esri</a>';
const OSM_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

const darkBase = L.layerGroup([
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
    { attribution: ESRI_ATTRIBUTION, maxZoom: 16 }),
  // Separate reference layer; the Esri canvas bases ship without labels.
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 16 }),
]);

const streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: OSM_ATTRIBUTION, maxZoom: 19,
});

const satellite = L.layerGroup([
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution: ESRI_ATTRIBUTION, maxZoom: 19 }),
  L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19 }),
]);

// Registered before the first layer is added, so the default base is covered too.
map.on('layeradd', (event) => {
  if (event.layer.on) event.layer.on('tileerror', () => toast(t('tileError')));
});

darkBase.addTo(map);
const layerControl = L.control.layers({}, null, { position: 'topright' }).addTo(map);

function labelLayers() {
  // Leaflet has no rename, so the control is rebuilt when the language changes.
  for (const layer of [darkBase, streets, satellite]) layerControl.removeLayer(layer);
  layerControl.addBaseLayer(darkBase, t('layerDark'));
  layerControl.addBaseLayer(streets, t('layerStreets'));
  layerControl.addBaseLayer(satellite, t('layerSatellite'));
}

const state = {
  mode: 'teleport',
  points: [],          // [{lat, lng}]
  markers: [],         // vertex markers, index-aligned with points
  loop: false,
  jitter: false,
  speed: 5,
  running: false,
  paused: false,
  seeking: false,
  lastPosition: null,   // most recent simulated position, for the Use current button
};

const line = L.polyline([], { color: '#5b8cff', weight: 4, opacity: .85 }).addTo(map);
const ghost = L.circleMarker([0, 0], {
  radius: 7, color: '#fff', weight: 2, fillColor: '#37c98b', fillOpacity: 1,
});
let ghostOnMap = false;

const $ = (id) => document.getElementById(id);

function toast(message) {
  const box = $('toast');
  box.textContent = message;
  box.style.display = 'block';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { box.style.display = 'none'; }, 6000);
}

async function api(path, body) {
  const options = body === undefined
    ? { method: 'POST' }
    : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const detail = data.detail;
    const error = new Error(
      (detail && detail.message) || (typeof detail === 'string' ? detail : response.statusText));
    if (detail && detail.code) error.code = detail.code;
    throw error;
  }
  return data;
}

// ---- route editing -------------------------------------------------------
// Vertices are plain draggable markers rather than a draw-plugin's modal
// state machine: click adds, drag moves, right-click deletes, and clicking the
// line inserts a vertex at that spot. Every edit is live.

function makeVertex(latlng, index) {
  const marker = L.circleMarker(latlng, {
    radius: 6, color: '#fff', weight: 2, fillColor: '#5b8cff', fillOpacity: 1,
    draggable: true, bubblingMouseEvents: false,
  });
  marker.on('mousedown', (event) => {
    // circleMarker has no built-in dragging, so pan is disabled while dragging.
    L.DomEvent.stop(event);
    map.dragging.disable();
    const move = (moveEvent) => {
      marker.setLatLng(moveEvent.latlng);
      state.points[state.markers.indexOf(marker)] = moveEvent.latlng;
      redraw(false);
    };
    const up = () => {
      map.off('mousemove', move).off('mouseup', up);
      map.dragging.enable();
      redraw();
    };
    map.on('mousemove', move).on('mouseup', up);
  });
  marker.on('contextmenu', (event) => {
    L.DomEvent.stop(event);
    const at = state.markers.indexOf(marker);
    if (at >= 0) { removeVertex(at); }
  });
  marker.addTo(map);
  state.markers.splice(index, 0, marker);
  state.points.splice(index, 0, latlng);
  return marker;
}

function removeVertex(index) {
  map.removeLayer(state.markers[index]);
  state.markers.splice(index, 1);
  state.points.splice(index, 1);
  redraw();
}

function clearRoute() {
  state.markers.forEach((marker) => map.removeLayer(marker));
  state.markers = [];
  state.points = [];
  redraw();
}

function metersBetween(a, b) { return map.distance(a, b); }

function routeLength() {
  let total = 0;
  for (let i = 1; i < state.points.length; i += 1) {
    total += metersBetween(state.points[i - 1], state.points[i]);
  }
  return total;
}

function redraw(updateStats = true) {
  line.setLatLngs(state.points);
  if (!updateStats) return;
  $('pointCount').textContent = state.points.length;
  const length = routeLength();
  $('routeLength').textContent = length >= 1000
    ? (length / 1000).toFixed(2) + ' km'
    : length.toFixed(0) + ' m';
}

line.on('click', (event) => {
  if (state.mode !== 'draw') return;
  L.DomEvent.stop(event);
  // Insert into whichever segment the click landed closest to.
  let best = 1;
  let bestDistance = Infinity;
  for (let i = 1; i < state.points.length; i += 1) {
    const midpoint = L.latLng(
      (state.points[i - 1].lat + state.points[i].lat) / 2,
      (state.points[i - 1].lng + state.points[i].lng) / 2,
    );
    const distance = metersBetween(midpoint, event.latlng);
    if (distance < bestDistance) { bestDistance = distance; best = i; }
  }
  makeVertex(event.latlng, best);
  redraw();
});

map.on('click', async (event) => {
  if (state.mode === 'draw') {
    makeVertex(event.latlng, state.points.length);
    redraw();
    return;
  }
  try {
    await api('/api/location', { lat: event.latlng.lat, lon: event.latlng.lng });
  } catch (error) { toast(error.message); }
});

// ---- controls ------------------------------------------------------------

function refreshToggleLabels() {
  $('loopBtn').textContent = `${t('loop')} ${t(state.loop ? 'on' : 'off')}`;
  $('jitterBtn').textContent = `${t('jitter')} ${t(state.jitter ? 'on' : 'off')}`;
}

function setMode(mode) {
  state.mode = mode;
  $('modeTeleport').classList.toggle('on', mode === 'teleport');
  $('modeDraw').classList.toggle('on', mode === 'draw');
  $('modeHint').textContent = t(mode === 'draw' ? 'hintDraw' : 'hintTeleport');
}
$('modeTeleport').onclick = () => setMode('teleport');
$('modeDraw').onclick = () => setMode('draw');

$('undoBtn').onclick = () => { if (state.points.length) removeVertex(state.points.length - 1); };
$('clearRouteBtn').onclick = clearRoute;

function setSpeed(value, push = true) {
  state.speed = value;
  $('speedRange').value = value;
  $('speedValue').textContent = value.toFixed(1);
  if (push && state.running) api('/api/route/speed', { speed_kmh: value }).catch((e) => toast(e.message));
}
$('speedRange').oninput = (event) => setSpeed(parseFloat(event.target.value));
document.querySelectorAll('[data-speed]').forEach((button) => {
  button.onclick = () => setSpeed(parseFloat(button.dataset.speed));
});

$('loopBtn').onclick = () => {
  state.loop = !state.loop;
  $('loopBtn').classList.toggle('on', state.loop);
  refreshToggleLabels();
};
$('jitterBtn').onclick = () => {
  state.jitter = !state.jitter;
  $('jitterBtn').classList.toggle('on', state.jitter);
  refreshToggleLabels();
};

$('playBtn').onclick = async () => {
  if (state.paused) {
    try { await api('/api/route/resume'); } catch (error) { toast(error.message); }
    return;
  }
  if (state.points.length < 2) { toast(t('needTwoPoints')); return; }
  try {
    await api('/api/route/start', {
      points: state.points.map((p) => [p.lat, p.lng]),
      speed_kmh: state.speed,
      loop: state.loop,
      jitter_m: state.jitter ? 3 : 0,
    });
  } catch (error) { toast(error.message); }
};
$('pauseBtn').onclick = () => api('/api/route/pause').catch((e) => toast(e.message));
$('stopBtn').onclick = () => api('/api/route/stop').catch((e) => toast(e.message));
$('clearLocBtn').onclick = () => api('/api/clear').catch((e) => toast(e.message));

const seek = $('seekRange');
seek.addEventListener('pointerdown', () => { state.seeking = true; });
seek.addEventListener('change', async () => {
  try { await api('/api/route/seek', { fraction: parseFloat(seek.value) }); }
  catch (error) { toast(error.message); }
  finally { state.seeking = false; }
});

// ---- coordinate input ----------------------------------------------------
// One parser behind both the search box and the lat/lon fields, so anything
// you can paste in one place works in the other.

const DMS_RE = /(\d+(?:\.\d+)?)\s*°\s*(?:(\d+(?:\.\d+)?)\s*['\u2032]\s*)?(?:(\d+(?:\.\d+)?)\s*["\u2033]?\s*)?([NSEW])/gi;
const DECIMAL_RE = /^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/;

function validCoordinates(lat, lon) {
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
  if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return { lat, lon };
}

function parseCoordinates(text) {
  const raw = (text || '').trim();
  if (!raw) return null;

  // Google Maps: .../@25.03,121.56,17z  and  ?q=25.03,121.56
  const at = raw.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if (at) return validCoordinates(parseFloat(at[1]), parseFloat(at[2]));
  const query = raw.match(/[?&](?:q|ll|daddr|destination)=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if (query) return validCoordinates(parseFloat(query[1]), parseFloat(query[2]));

  // Degrees/minutes/seconds, e.g. 25°02'02.3"N 121°33'52.1"E
  const parts = [...raw.matchAll(DMS_RE)];
  if (parts.length === 2) {
    const axes = {};
    for (const part of parts) {
      const value = parseFloat(part[1])
        + (part[2] ? parseFloat(part[2]) / 60 : 0)
        + (part[3] ? parseFloat(part[3]) / 3600 : 0);
      const hemisphere = part[4].toUpperCase();
      const axis = (hemisphere === 'N' || hemisphere === 'S') ? 'lat' : 'lon';
      axes[axis] = (hemisphere === 'S' || hemisphere === 'W') ? -value : value;
    }
    if ('lat' in axes && 'lon' in axes) return validCoordinates(axes.lat, axes.lon);
  }

  const decimal = raw.match(DECIMAL_RE);
  if (decimal) return validCoordinates(parseFloat(decimal[1]), parseFloat(decimal[2]));

  return null;
}

function showCoordinates(point) {
  $('placeInput').value = `${point.lat.toFixed(6)}, ${point.lon.toFixed(6)}`;
}

async function geocode(query) {
  try {
    const response = await fetch(
      'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query));
    const results = await response.json();
    if (!results.length) { toast(t('notFound')(query)); return null; }
    return { lat: parseFloat(results[0].lat), lon: parseFloat(results[0].lon) };
  } catch (error) { toast(t('searchFailed')(error.message)); return null; }
}

// Every button funnels through here, so each one takes coordinates or a place
// name interchangeably. Resolved names are written back as coordinates.
async function resolvePlace() {
  const text = $('placeInput').value.trim();
  if (!text) { toast(t('needInput')); return null; }
  const parsed = parseCoordinates(text);
  if (parsed) { showCoordinates(parsed); return parsed; }
  const found = await geocode(text);
  if (found) showCoordinates(found);
  return found;
}

function focusOn(point, minZoom = 15) {
  map.setView([point.lat, point.lon], Math.max(map.getZoom(), minZoom));
}

$('gotoBtn').onclick = async () => {
  const point = await resolvePlace();
  if (!point) return;
  focusOn(point);
  try { await api('/api/location', { lat: point.lat, lon: point.lon }); }
  catch (error) { toast(error.message); }
};

$('panBtn').onclick = async () => {
  const point = await resolvePlace();
  if (point) focusOn(point);
};

$('appendBtn').onclick = async () => {
  const point = await resolvePlace();
  if (!point) return;
  makeVertex(L.latLng(point.lat, point.lon), state.points.length);
  redraw();
  focusOn(point);
  setMode('draw');
};

$('fillBtn').onclick = () => {
  if (!state.lastPosition) { toast(t('noSimulatedPosition')); return; }
  showCoordinates(state.lastPosition);
};

$('placeInput').onkeydown = async (event) => {
  if (event.key !== 'Enter') return;
  const text = $('placeInput').value.trim();
  if (!text) return;

  // Coordinates are unambiguous, so Enter sends them straight to the device.
  // A place name only gets looked up and filled in, leaving the send to you.
  if (parseCoordinates(text)) { $('gotoBtn').click(); return; }
  const found = await geocode(text);
  if (!found) return;
  showCoordinates(found);
  focusOn(found, 16);
  toast(t('filledIn'));
};

// ---- device --------------------------------------------------------------

const TRANSPORT_LABEL = { usb: 'USB', wifi: 'WiFi', unknown: '' };

function describeDevice(device) {
  if (!device.online) {
    const seen = device.lastSeen ? device.lastSeen.replace('T', ' ').replace('+00:00', '') : '';
    return `${device.name} · ${t('offline')}${seen ? ` (${t('lastSeen')} ${seen} UTC)` : ''}`;
  }
  const badge = TRANSPORT_LABEL[device.transport] || '';
  return `${device.name} · iOS ${device.iosVersion}${badge ? ' · ' + badge : ''}`;
}

// A freshly started tunnel daemon has not finished looking yet: it polls for
// paired devices on the network every few seconds, and each one still needs a
// handshake. USB usually beats the first scan, Wi-Fi rarely does -- so an empty
// result means "keep looking", not "nothing there".
const SCAN_RETRY_MS = 3000;
const SCAN_RETRY_LIMIT = 12;   // ~36 s, comfortably past a cold tunnel start
let scanTimer = null;

function stopScanning() {
  if (scanTimer !== null) {
    clearTimeout(scanTimer);
    scanTimer = null;
  }
}

let canDiscoverOverWifi = true;

async function fetchDevices() {
  const response = await fetch('/api/devices');
  const data = await response.json();
  if (!response.ok) throw new Error(data.detail || response.statusText);
  canDiscoverOverWifi = data.canDiscoverOverWifi !== false;
  return data.devices;
}

function fillDeviceSelect(devices) {
  const select = $('deviceSelect');
  const previous = select.value;
  select.innerHTML = '';
  for (const device of devices) {
    const option = document.createElement('option');
    option.value = device.udid;
    option.textContent = describeDevice(device);
    // Remembered but unreachable: shown so the phone stays recognisable,
    // not selectable because there is no tunnel to talk over.
    option.disabled = !device.online;
    select.appendChild(option);
  }
  if (previous) select.value = previous;
}

// Says which of the identical-looking Wi-Fi failures this one is. One of them
// cannot be fixed by pairing again, so the wrong advice here wastes real time.
async function showWifiDiagnosis() {
  const panel = $('diagnosis');
  panel.style.display = 'block';
  panel.innerHTML = `<b>${t('checking')}</b>`;
  try {
    const result = await (await fetch('/api/diagnose')).json();
    if (result.ok) {
      panel.innerHTML = `<b>${t('wifiOk')}</b><br>${t('wifiOkDetail')}`;
      return;
    }
    const [reason, actions] = t('diag')[result.code] || [result.code, []];
    const steps = actions.map((action) => `<li>${action}</li>`).join('');
    panel.innerHTML = `<b>${reason}</b><ul>${steps}</ul>`;
  } catch (error) {
    panel.innerHTML = `<b>${t('diagnoseFailed')}</b><br>${error.message}`;
  }
}

async function refreshDevices({ attempt = 0 } = {}) {
  $('diagnosis').style.display = 'none';
  const select = $('deviceSelect');
  stopScanning();

  let devices;
  try {
    devices = await fetchDevices();
  } catch (error) {
    select.innerHTML = `<option value="">${t('tunneldDown')}</option>`;
    toast(error.message);
    return;
  }

  const online = devices.filter((device) => device.online);
  if (online.length) {
    fillDeviceSelect(devices);
    return;
  }

  const keepLooking = attempt < SCAN_RETRY_LIMIT;
  if (devices.length) {
    fillDeviceSelect(devices);
  } else {
    select.innerHTML = keepLooking
      ? `<option value="">${t('searching')}… (${attempt + 1}/${SCAN_RETRY_LIMIT})</option>`
      : `<option value="">${t('noDevices')}</option>`;
  }

  // Without a pairing record, Wi-Fi discovery has nothing to match against, so
  // waiting will never help -- diagnose immediately instead of retrying.
  if (!canDiscoverOverWifi) {
    showWifiDiagnosis();
    return;
  }

  if (keepLooking) {
    if (attempt === 0) {
      toast(t('stillLooking'));
    }
    scanTimer = setTimeout(() => refreshDevices({ attempt: attempt + 1 }), SCAN_RETRY_MS);
    return;
  }

  showWifiDiagnosis();
}

$('refreshBtn').onclick = () => refreshDevices();
$('connectBtn').onclick = async () => {
  const udid = $('deviceSelect').value;
  if (!udid) { toast(t('pickDevice')); return; }
  stopScanning();
  try { await api('/api/connect', { udid }); } catch (error) { toast(error.message); }
};
$('disconnectBtn').onclick = () => api('/api/disconnect').catch((e) => toast(e.message));
$('pairBtn').onclick = async () => {
  const button = $('pairBtn');
  button.disabled = true;
  button.textContent = t('pairing');
  try {
    const data = await api('/api/pair');
    const macs = data.paired.map((entry) => entry.wifiMac).join(', ');
    toast(t('paired')(macs));
    canDiscoverOverWifi = true;
    refreshDevices();
  } catch (error) {
    toast(t('pairErr')[error.code] || error.message);
  } finally {
    button.disabled = false;
    button.textContent = t('pairUsb');
  }
};

$('mountBtn').onclick = async () => {
  try { await api('/api/mount'); toast(t('mounted')); }
  catch (error) { toast(error.message); }
};

// ---- live status ---------------------------------------------------------

const STATE_KEYS = {
  disconnected: 'stateDisconnected', connecting: 'stateConnecting',
  connected: 'stateConnected', reconnecting: 'stateReconnecting', error: 'stateError',
};

let lastSnapshot = null;

function render(snapshot) {
  lastSnapshot = snapshot;
  const session = snapshot.session;
  const route = snapshot.route;

  $('stateDot').className = 'dot ' + session.state;
  $('stateText').textContent = t(STATE_KEYS[session.state]) || session.state;
  $('deviceMeta').textContent = session.deviceName
    ? `${session.deviceName} · iOS ${session.iosVersion}` : '';
  $('statsMeta').innerHTML = session.error
    ? `<span style="color:var(--bad)">${session.error}</span>`
    : `${t('writes')} <b>${session.writes}</b> · ${t('reconnects')} <b>${session.reconnects}</b>`;

  if (session.lat !== null && session.lon !== null) {
    state.lastPosition = { lat: session.lat, lon: session.lon };
    const latlng = [session.lat, session.lon];
    ghost.setLatLng(latlng);
    if (!ghostOnMap) { ghost.addTo(map); ghostOnMap = true; }
    $('posMeta').innerHTML = `<b>${session.lat.toFixed(6)}, ${session.lon.toFixed(6)}</b>`
      + (route.running ? ` · ${t('heading')} <b>${Math.round(session.heading)}°</b>` : '');
  } else if (ghostOnMap) {
    map.removeLayer(ghost);
    ghostOnMap = false;
    state.lastPosition = null;
    $('posMeta').textContent = '—';
  }

  state.running = route.running;
  state.paused = route.paused;
  $('playBtn').textContent = t(route.paused ? 'resumeRoute' : 'start');
  $('playBtn').disabled = route.running && !route.paused;
  $('pauseBtn').disabled = !route.running || route.paused;
  $('stopBtn').disabled = !route.running;

  if (!state.seeking) seek.value = route.progress;
  $('progressBar').style.width = (route.progress * 100).toFixed(1) + '%';
  $('progressText').textContent = `${Math.round(route.distanceM)} / ${Math.round(route.totalM)} m`;
  $('etaText').textContent = route.etaSeconds === null
    ? '—'
    : new Date(route.etaSeconds * 1000).toISOString().substring(11, 19);
}

function connectSocket() {
  const socket = new WebSocket(`ws://${location.host}/ws`);
  socket.onmessage = (event) => render(JSON.parse(event.data));
  socket.onclose = () => setTimeout(connectSocket, 1000);
}

$('langBtn').onclick = () => {
  lang = lang === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('sesame.lang', lang); } catch (error) { /* private mode */ }
  applyLanguage();
  labelLayers();
  refreshDevices();
};

setMode('teleport');
setSpeed(5, false);
applyLanguage();
labelLayers();
connectSocket();
refreshDevices();
</script>
</body>
</html>
